<div id="root"></div>

<script>
/* ---------------- Config & Constants ---------------- */
const SKIN_TONES = ["#FFDDB8", "#F0B784", "#C6875A", "#8A5A34"];
const HAIR_COLORS = ["#1C1917", "#5A3722", "#A9713A", "#EAB308", "#94A3B8"];
const HAIR_STYLES = ["สั้น", "หยิก", "ยาว", "ทรงตัด/Undercut"];
const SHIRT_COLORS = ["#FF6B4A", "#3B82F6", "#10B981", "#F59E0B", "#8B5CF6", "#1E293B"];
const PANTS_COLORS = ["#1E293B", "#3B82F6", "#64748B", "#334155", "#78350F"];
const SHOE_COLORS = ["#1E293B", "#FFFFFF", "#FF6B4A", "#F59E0B"];

const ACTIVITY_LEVELS = [
  {id:"sedentary", label:"แทบไม่ออกกำลังกาย (Sedentary)", mult:1.2},
  {id:"light", label:"ออกกำลังกายเบาๆ 1-3 วัน/สัปดาห์", mult:1.375},
  {id:"moderate", label:"ออกกำลังกายปานกลาง 3-5 วัน/สัปดาห์", mult:1.55},
  {id:"active", label:"ออกกำลังกายหนัก 6-7 วัน/สัปดาห์", mult:1.725},
  {id:"veryActive", label:"ออกกำลังกายหนักมาก / งานใช้แรงงาน", mult:1.9},
];

const GOALS = [
  {id:"lose", label:"ลดน้ำหนัก (-15%)", adj:-0.15},
  {id:"maintain", label:"รักษาน้ำหนัก", adj:0},
  {id:"gain", label:"เพิ่มน้ำหนัก (+15%)", adj:0.15},
];

const LS_KEYS = {
  profile: "impodee_profile",
  avatar: "impodee_avatar",
  apiKey: "impodee_api_key",
  logPrefix: "impodee_logs_"
};

function todayStr(d = new Date()){ return d.toISOString().slice(0,10); }

function loadJSON(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }

/* ---------------- TDEE & Calculation Engine ---------------- */
function calcTargets(p){
  const w = Number(p.weight) || 65;
  const h = Number(p.height) || 170;
  const a = Number(p.age) || 25;
  
  // Mifflin-St Jeor Formula
  let bmr = p.gender === "female" ? (10*w + 6.25*h - 5*a - 161) : (10*w + 6.25*h - 5*a + 5);
  const actMult = (ACTIVITY_LEVELS.find(x => x.id === p.activity) || ACTIVITY_LEVELS[0]).mult;
  const goalAdj = (GOALS.find(x => x.id === p.goal) || GOALS[1]).adj;
  
  const tdee = bmr * actMult;
  const calories = Math.max(1000, Math.round(tdee * (1 + goalAdj)));
  const protein = Math.round(w * 1.8);
  const fat = Math.round((calories * 0.25) / 9);
  const carb = Math.max(0, Math.round((calories - protein*4 - fat*9) / 4));
  
  return { calories, protein, fat, carb, sodium: 2000, tdee: Math.round(tdee) };
}

function sumLog(meals){
  return meals.reduce((acc, m) => ({
    calories: acc.calories + (Number(m.calories) || 0),
    protein: acc.protein + (Number(m.protein) || 0),
    fat: acc.fat + (Number(m.fat) || 0),
    carb: acc.carb + (Number(m.carb) || 0),
    sodium: acc.sodium + (Number(m.sodium) || 0),
  }), { calories:0, protein:0, fat:0, carb:0, sodium:0 });
}

function classifyMood(totals, targets){
  if(!totals.calories) return "idle";
  const r = totals.calories / targets.calories;
  if(r > 1.1) return "full";
  if(r < 0.85) return "hungry";
  return "happy";
}

/* ---------------- Initial State ---------------- */
const DEFAULT_PROFILE = { gender:"male", age:"25", weight:"65", height:"170", activity:"sedentary", goal:"maintain" };
const DEFAULT_AVATAR = { skinTone:0, hairStyle:0, hairColor:0, shirtColor:0, pantsColor:0, shoeColor:0 };

let state = {
  tab: "home",
  profile: loadJSON(LS_KEYS.profile, DEFAULT_PROFILE),
  avatar: loadJSON(LS_KEYS.avatar, DEFAULT_AVATAR),
  apiKey: localStorage.getItem(LS_KEYS.apiKey) || "",
  meals: loadJSON(LS_KEYS.logPrefix + todayStr(), []),
  form: { name:"", calories:"", protein:"", fat:"", carb:"", sodium:"" },
  scanning: false,
  scanError: "",
  profileDraft: null,
};
state.profileDraft = { ...state.profile };

function setState(patch){
  state = { ...state, ...patch };
  render();
}

/* ---------------- Flixo SVG Avatar Generator ---------------- */
function avatarSVG(config, mood, size = 180){
  const skin = SKIN_TONES[config.skinTone] || SKIN_TONES[0];
  const hairColor = HAIR_COLORS[config.hairColor] || HAIR_COLORS[0];
  const shirt = SHIRT_COLORS[config.shirtColor] || SHIRT_COLORS[0];
  const pants = PANTS_COLORS[config.pantsColor] || PANTS_COLORS[0];
  const shoe = SHOE_COLORS[config.shoeColor] || SHOE_COLORS[0];
  
  const isFull = mood === "full";
  const isHungry = mood === "hungry";
  const isHappy = mood === "happy";
  const torsoScaleX = isHungry ? 0.84 : 1;

  let hair = "";
  if(config.hairStyle === 0){
    hair = `<path d="M58 58 Q100 20 142 58 Q142 40 100 34 Q58 40 58 58 Z" fill="${hairColor}"/>`;
  } else if(config.hairStyle === 1){
    hair = `<g fill="${hairColor}">
      <path d="M56 60 Q100 16 144 60 Q146 38 100 30 Q54 38 56 60 Z"/>
      <circle cx="66" cy="52" r="9"/><circle cx="80" cy="40" r="10"/>
      <circle cx="100" cy="35" r="10"/><circle cx="120" cy="40" r="10"/>
      <circle cx="134" cy="52" r="9"/>
    </g>`;
  } else if(config.hairStyle === 2){
    hair = `<path d="M55 62 Q52 20 100 22 Q148 20 145 62 Q140 30 100 30 Q60 30 55 62 Z M50 70 Q46 110 58 120 L60 78 Z M150 70 Q154 110 142 120 L140 78 Z" fill="${hairColor}"/>`;
  } else {
    hair = `<path d="M62 52 Q100 30 138 52 Q136 42 100 38 Q64 42 62 52 Z" fill="${hairColor}"/>`;
  }

  let eyes = (isHappy || mood === "idle")
    ? `<circle cx="84" cy="72" r="4.5" fill="#111827"/><circle cx="116" cy="72" r="4.5" fill="#111827"/>`
    : isFull
      ? `<path d="M78 70 Q84 64 90 70" stroke="#111827" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M110 70 Q116 64 122 70" stroke="#111827" stroke-width="3.5" fill="none" stroke-linecap="round"/>`
      : `<path d="M78 76 Q84 68 90 76" stroke="#111827" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M110 76 Q116 68 122 76" stroke="#111827" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;

  let mouth = "";
  if(isHappy) mouth += `<path d="M82 90 Q100 106 118 90" stroke="#111827" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  if(mood === "idle") mouth += `<path d="M84 92 Q100 98 116 92" stroke="#111827" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  if(isFull) mouth += `<ellipse cx="100" cy="94" rx="7" ry="5" fill="#111827"/><path d="M126 58 q6 4 4 12" stroke="#3B82F6" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>`;
  if(isHungry) mouth += `<path d="M88 96 Q100 90 112 96" stroke="#111827" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M128 60 q7 6 3 14" stroke="#3B82F6" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>`;

  return `
  <svg viewBox="0 0 200 260" width="${size}" height="${Math.round(size*260/200)}" style="overflow:visible">
    <ellipse cx="100" cy="248" rx="46" ry="8" fill="#111827" opacity="0.08"/>
    <rect x="72" y="168" width="20" height="55" rx="10" fill="${pants}"/>
    <rect x="108" y="168" width="20" height="55" rx="10" fill="${pants}"/>
    <ellipse cx="82" cy="228" rx="15" ry="9" fill="${shoe}" stroke="#111827" stroke-opacity="0.15"/>
    <ellipse cx="118" cy="228" rx="15" ry="9" fill="${shoe}" stroke="#111827" stroke-opacity="0.15"/>
    <g transform="translate(100 150) scale(${torsoScaleX} 1) translate(-100 -150)">
      <path d="M66 118 Q100 100 134 118 L140 178 Q100 196 60 178 Z" fill="${shirt}"/>
      ${isFull ? `<ellipse cx="100" cy="182" rx="34" ry="24" fill="${skin}" stroke="#00000012"/><ellipse cx="100" cy="176" rx="20" ry="6" fill="#FFFFFF" opacity="0.35"/>` : ""}
      ${isHungry ? `<g stroke="${hairColor}" stroke-opacity="0.2" stroke-width="2" fill="none"><path d="M78 132 Q100 138 122 132"/><path d="M76 146 Q100 153 124 146"/></g>` : ""}
    </g>
    <ellipse cx="58" cy="150" rx="12" ry="28" fill="${skin}" transform="rotate(-8 58 150)"/>
    <ellipse cx="142" cy="150" rx="12" ry="28" fill="${skin}" transform="rotate(8 142 150)"/>
    <circle cx="100" cy="70" r="42" fill="${skin}"/>
    <circle cx="60" cy="72" r="8" fill="${skin}"/>
    <circle cx="140" cy="72" r="8" fill="${skin}"/>
    ${hair}
    ${eyes}
    ${mouth}
    <circle cx="70" cy="84" r="6" fill="#FF6B4A" opacity="${isHappy ? 0.32 : 0.15}"/>
    <circle cx="130" cy="84" r="6" fill="#FF6B4A" opacity="${isHappy ? 0.32 : 0.15}"/>
  </svg>`;
}

/* ---------------- Render Helpers & Screens ---------------- */
function statRow(label, value, target, unit, color, icon){
  const pct = Math.min(100, Math.round((value / Math.max(1, target)) * 100));
  return `
  <div class="stat-item">
    <div class="stat-label-row">
      <span class="stat-name">${icon} ${label}</span>
      <span class="stat-value">${Math.round(value)} <span class="stat-target">/ ${target} ${unit}</span></span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" style="width:${pct}%; background:${color}"></div>
    </div>
  </div>`;
}

function computeStreak(targets){
  let count = 0;
  const totals = sumLog(state.meals);
  const todayOnTarget = classifyMood(totals, targets) === "happy";
  if(todayOnTarget) count += 1;

  const cursor = new Date();
  cursor.setDate(cursor.getDate() - 1);
  for(let i = 0; i < 60; i++){
    const key = LS_KEYS.logPrefix + todayStr(cursor);
    const raw = localStorage.getItem(key);
    if(raw === null) break;
    const dayMeals = JSON.parse(raw);
    const dayTotals = sumLog(dayMeals);
    const ratio = dayTotals.calories / Math.max(1, targets.calories);
    if(ratio >= 0.85 && ratio <= 1.1){
      count += 1;
      cursor.setDate(cursor.getDate() - 1);
    } else break;
  }
  return count;
}

function arrowPickerHTML(label, options, index, field, renderFn){
  const n = options.length;
  const inner = renderFn ? renderFn(options[index]) : `<span style="font-size:13.5px; color:var(--ink); font-weight:600">${options[index]}</span>`;
  return `
  <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.7); border:1px solid var(--line); border-radius:var(--radius-md); padding:10px 14px; margin-bottom:10px">
    <span style="font-weight:600; font-size:13.5px">${label}</span>
    <div style="display:flex; align-items:center; gap:12px">
      <button class="arrow-btn" onclick="cycleAvatar('${field}', -1, ${n})">‹</button>
      <div style="min-width:60px; display:flex; justify-content:center">${inner}</div>
      <button class="arrow-btn" onclick="cycleAvatar('${field}', 1, ${n})">›</button>
    </div>
  </div>`;
}

function swatch(color){
  return `<div class="swatch" style="background:${color}; ${color==='#FFFFFF' ? 'box-shadow:inset 0 0 0 1px #ddd;' : ''}"></div>`;
}

function cycleAvatar(field, dir, n){
  const idx = state.avatar[field];
  const next = (idx + dir + n) % n;
  const avatar = { ...state.avatar, [field]: next };
  saveJSON(LS_KEYS.avatar, avatar);
  setState({ avatar });
}

function formField(label, key, value){

function escapeAttr(s){ return String(s).replace(/"/g, '&quot;'); }

function updateForm(key, value){ state.form = { ...state.form, [key]: value }; }

function submitMeal(){
  const f = state.form;
  if(!f.name.trim() || f.calories === "") return;
  const meal = {
    id: Date.now().toString(),
    name: f.name.trim(),
    calories: Number(f.calories) || 0,
    protein: Number(f.protein) || 0,
    fat: Number(f.fat) || 0,
    carb: Number(f.carb) || 0,
    sodium: Number(f.sodium) || 0
  };
  const meals = [...state.meals, meal];
  saveJSON(LS_KEYS.logPrefix + todayStr(), meals);
  setState({ meals, form:{ name:"", calories:"", protein:"", fat:"", carb:"", sodium:"" } });
}

function deleteMeal(id){
  const meals = state.meals.filter(m => m.id !== id);
  saveJSON(LS_KEYS.logPrefix + todayStr(), meals);
  setState({ meals });
}

function triggerCamera(isBarcode){
  const el = document.getElementById(isBarcode ? 'barcodeInput' : 'cameraInput');
  if(el) el.click();
}

async function handleImageSelected(inputEl, isBarcode){
  const file = inputEl.files[0];
  if(!file) return;
  setState({ scanning: true, scanError: "" });
  try {
    const base64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(",")[1]);
      r.onerror = () => rej(new Error("อ่านไฟล์ไม่สำเร็จ"));
      r.readAsDataURL(file);
    });

    const promptText = isBarcode
      ? "นี่คือรูปฉลากโภชนาการหรือบาร์โค้ดของอาหาร กรุณาประเมินค่าโภชนาการต่อ 1 หน่วยบริโภค ตอบเป็น JSON เท่านั้น รูปแบบ: {\"name\": string, \"calories\": number, \"protein\": number, \"fat\": number, \"carb\": number, \"sodium\": number}"
      : "นี่คือรูปอาหารหนึ่งมื้อ กรุณาประเมินค่าโภชนาการโดยรวมอย่างสมเหตุสมผล ตอบเป็น JSON เท่านั้น รูปแบบ: {\"name\": string, \"calories\": number, \"protein\": number, \"fat\": number, \"carb\": number, \"sodium\": number}";

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": state.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: file.type || "image/jpeg", data: base64 } },
            { type: "text", text: promptText }
          ]
        }]
      })
    });

    const data = await response.json();
    if(data.error) throw new Error(data.error.message || "API error");

    const text = (data.content || []).map(c => c.text || "").join("");
    const clean = text.replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(clean);

    setState({
      form: {
        name: parsed.name || "อาหารจากรูปภาพ",
        calories: String(Math.round(parsed.calories || 0)),
        protein: String(Math.round(parsed.protein || 0)),
        fat: String(Math.round(parsed.fat || 0)),
        carb: String(Math.round(parsed.carb || 0)),
        sodium: String(Math.round(parsed.sodium || 0)),
      },
      scanning: false
    });
  } catch(e) {
    setState({ scanning: false, scanError: "สแกนไม่สำเร็จ (" + e.message + ") กรุณากรอกข้อมูลเอง หรือตรวจสอบ API key" });
  } finally {
    inputEl.value = "";
  }
}

      <select class="field-input" onchange="setDraft('activity', this.value)">
        ${ACTIVITY_LEVELS.map(a => `<option value="${a.id}" ${d.activity===a.id?'selected':''}>${a.label}</option>`).join("")}
      </select>
    </div>

    <div class="field-group">
      <label class="field-label">เป้าหมายน้ำหนัก</label>
      <div class="segmented-control">
        ${GOALS.map(g => `
          <button class="segmented-btn ${d.goal===g.id?'active':''}" onclick="setDraft('goal','${g.id}')">
            ${g.label}
          </button>
        `).join("")}
      </div>
    </div>

    <button class="primary-btn" style="margin-top:16px" onclick="saveProfile()">
      💾 บันทึกและคำนวณเป้าหมายใหม่
    </button>
  </div>

  <div class="glass-card">
    <div class="card-title">สรุปค่าพลังงานที่คำนวณได้</div>
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-top:8px">
      <div>
        <div style="font-size:12px; color:var(--ink-soft)">ค่า TDEE พื้นฐาน</div>
        <div style="font-family:'Kanit'; font-size:26px; font-weight:700; color:var(--ink)">
          ${targets.tdee} <span style="font-size:14px; font-weight:400; color:var(--ink-soft)">kcal/วัน</span>
        </div>
      </div>
      <div style="text-align:right">
        <div style="font-size:12px; color:var(--emerald-deep); font-weight:600">เป้าหมายสุทธิ</div>
        <div style="font-family:'Kanit'; font-size:26px; font-weight:700; color:var(--emerald-deep)">
          ${targets.calories} <span style="font-size:14px; font-weight:400; color:var(--ink-soft)">kcal/วัน</span>
        </div>
      </div>
    </div>
  </div>`;
}

function setDraft(key, val){ state.profileDraft = { ...state.profileDraft, [key]: val }; render(); }
function saveProfile(){
  saveJSON(LS_KEYS.profile, state.profileDraft);
  setState({ profile: { ...state.profileDraft } });
}

function settingsScreen(){
  return `
  <div class="glass-card">
    <div class="card-title">ตั้งค่า Anthropic API Key (AI Vision)</div>
    
    <div style="background:rgba(59, 130, 246, 0.08); border:1px solid rgba(59, 130, 246, 0.2); border-radius:var(--radius-md); padding:12px 14px; font-size:12.5px; color:var(--blue-deep); margin-bottom:16px; line-height:1.6">
      🔒 <b>ความปลอดภัยข้อมูล:</b> API key ของคุณจะถูกบันทึกไว้อย่างปลอดภัยใน <code>localStorage</code> ของเบราว์เซอร์เครื่องนี้เท่านั้น ไม่มีการส่งผ่านเซิร์ฟเวอร์อื่นนอกเหนือจาก Anthropic Direct API
    </div>

    <div class="field-group">
      <label class="field-label">Anthropic API Key</label>
      <input class="field-input" type="password" placeholder="sk-ant-..." value="${escapeAttr(state.apiKey)}" oninput="updateApiKeyDraft(this.value)"/>
    </div>

    <button class="primary-btn" onclick="saveApiKey()">💾 บันทึก API Key</button>

    ${state.apiKey ? `
    <button onclick="clearApiKey()" style="width:100%; border:1.5px solid var(--coral); color:var(--coral-deep); background:transparent; border-radius:var(--radius-md); padding:12px 0; font-weight:600; font-size:14px; margin-top:10px">
      🗑️ ลบ API Key ออกจากเครื่องนี้
    </button>` : ""}
  </div>

  <div class="glass-card" style="text-align:center">
    <div style="font-family:'Kanit'; font-size:16px; font-weight:600; margin-bottom:4px">อิ่มพอดี (Impodee) v2.0</div>
    <div style="font-size:12px; color:var(--ink-soft); margin-bottom:14px">Flixo Clean & Minimalist Edition</div>
    <a href="https://github.com/meechiki/Impodee" target="_blank" class="github-badge" style="display:inline-flex">
      <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      ดูซอร์สโค้ดบน GitHub (meechiki/Impodee)
    </a>
  </div>`;
}

let apiKeyDraft = state.apiKey;
function updateApiKeyDraft(v){ apiKeyDraft = v; }
function saveApiKey(){
  localStorage.setItem(LS_KEYS.apiKey, apiKeyDraft.trim());
  setState({ apiKey: apiKeyDraft.trim() });
}
function clearApiKey(){
  localStorage.removeItem(LS_KEYS.apiKey);
  apiKeyDraft = "";
  setState({ apiKey: "" });
}

/* ---------------- Root Render Engine ---------------- */
const TABS = [
  { id:"home", label:"หน้าหลัก", icon:"🏠" },
  { id:"character", label:"ตัวละคร", icon:"🧍" },
  { id:"log", label:"มื้ออาหาร", icon:"🍽️" },
  { id:"profile", label:"โปรไฟล์", icon:"⚙️" },
  { id:"settings", label:"ตั้งค่า", icon:"🔑" },
];

function render(){
  const targets = calcTargets(state.profile);
  const streak = computeStreak(targets);

  let body = "";
  if(state.tab === "home") body = homeScreen();
  else if(state.tab === "character") body = characterScreen();
  else if(state.tab === "log") body = logScreen();
  else if(state.tab === "profile") body = profileScreen();
  else if(state.tab === "settings") body = settingsScreen();

  document.getElementById("root").innerHTML = `
    <div class="header-bar">
      <div>
        <div class="brand-title">
          <span>🥗</span> อิ่มพอดี
        </div>
        <div class="brand-subtitle">ผู้ช่วยคำนวณอาหารตาม TDEE</div>
      </div>
      <div style="display:flex; align-items:center; gap:8px">
        <a href="https://github.com/meechiki/Impodee" target="_blank" class="github-badge">
          <svg height="14" width="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          GitHub
        </a>
        <div class="streak-pill">
          <span class="streak-fire">🔥</span>
          <span style="font-family:'Kanit'; font-weight:700; font-size:14px; color:var(--gold-deep)">${streak}</span>
        </div>
      </div>
    </div>

    ${body}

    <div class="tabbar">
      <div class="tabbar-inner">
        ${TABS.map(t => `
          <button class="tab-btn ${state.tab === t.id ? 'active' : ''}" onclick="setState({tab:'${t.id}'})">
            <span class="tab-icon">${t.icon}</span>
            <span class="tab-label">${t.label}</span>
          </button>
        `).join("")}
      </div>
    </div>
  `;
}

// Initial Launch
render();
</script>
</body>
</html>
