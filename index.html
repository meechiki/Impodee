    padding: 3px 10px;

    box-shadow: var(--shadow-sm);
    margin-bottom: 4px;

  .icon-btn {

    height: 32px;

    background: rgba(255, 255, 255, 0.85);

    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    font-size: 14px;
    box-shadow: var(--shadow-sm);

  .icon-btn:hover {

    transform: translateY(-1px);
    color: var(--emerald-deep);

    background: var(--surface-glass);

    border-radius: var(--radius-xl);
    padding: 20px;
    box-shadow: var(--shadow-glass);
    margin-bottom: 16px;
    position: relative;

    display: grid;
    grid-template-columns: 130px 1fr;

    align-items: center;
    padding: 20px;
    overflow: hidden;
  }

      grid-template-columns: 1fr;
      text-align: center;
    }

  .avatar-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;

    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }

    font-weight: 600;
    font-size: 11.5px;
    margin-top: 6px;

  .segmented-btn {

    border-radius: var(--radius-sm);

    color: var(--emerald-deep);
    box-shadow: var(--shadow-sm);
  }

  button { cursor: pointer; border: none; outline: none; transition: all 0.2s ease; }

/* ---------------- TDEE & Math Engine ---------------- */
function calcTargets(p){
  const w = Number(p.weight) || 65;
  const h = Number(p.height) || 170;
  const a = Number(p.age) || 25;
  
  let bmr = p.gender === "female" ? (10*w + 6.25*h - 5*a - 161) : (10*w + 6.25*h - 5*a + 5);
  const actMult = (ACTIVITY_LEVELS.find(x => x.id === p.activity) || ACTIVITY_LEVELS[0]).mult;
  const goalAdj = (GOALS.find(x => x.id === p.goal) || GOALS[1]).adj;
  
  const tdee = bmr * actMult;
  const calories = Math.max(1000, Math.round(tdee * (1 + goalAdj)));
  const protein = Math.round(w * 1.8);
  const fat = Math.round((calories * 0.25) / 9);
  const carb = Math.max(0, Math.round((calories - protein*4 - fat*9) / 4));
  
  return { calories, protein, fat, carb, sodium: 2000, tdee: Math.round(tdee) };
}

function sumLog(meals){
  return meals.reduce((acc, m) => ({
    calories: acc.calories + (Number(m.calories) || 0),
    protein: acc.protein + (Number(m.protein) || 0),
    fat: acc.fat + (Number(m.fat) || 0),
    carb: acc.carb + (Number(m.carb) || 0),
    sodium: acc.sodium + (Number(m.sodium) || 0),
  }), { calories:0, protein:0, fat:0, carb:0, sodium:0 });
}

function classifyMood(totals, targets){
  if(!totals.calories) return "idle";
  const r = totals.calories / targets.calories;
  if(r > 1.1) return "full";
  if(r < 0.85) return "hungry";
  return "happy";
}

function computeStreak(targets){
  let count = 0;
  const totals = sumLog(state.meals);
  const todayOnTarget = classifyMood(totals, targets) === "happy";
  if(todayOnTarget) count += 1;

  const cursor = new Date();
  cursor.setDate(cursor.getDate() - 1);
  for(let i = 0; i < 60; i++){
    const key = LS_KEYS.logPrefix + todayStr(cursor);
    const raw = localStorage.getItem(key);
    if(raw === null) break;
    const dayMeals = JSON.parse(raw);
    const dayTotals = sumLog(dayMeals);
    const ratio = dayTotals.calories / Math.max(1, targets.calories);
    if(ratio >= 0.85 && ratio <= 1.1){
      count += 1;
      cursor.setDate(cursor.getDate() - 1);
    } else break;
  }
  return count;
}

/* ---------------- Render Helpers ---------------- */
function macroPill(label, value, target, unit, color, icon){
  const pct = Math.min(100, Math.round((value / Math.max(1, target)) * 100));
  return `
  <div class="macro-pill">
    <div class="macro-header">
      <span>${icon} ${label}</span>
      <span>${pct}%</span>
    </div>
    <div class="macro-val">${Math.round(value)} <span style="font-size:11px; color:var(--ink-soft); font-weight:400">/ ${target}${unit}</span></div>
    <div class="progress-track">
      <div class="progress-fill" style="width:${pct}%; background:${color}"></div>
    </div>
  </div>`;
}

function arrowPickerHTML(label, options, index, field, renderFn){
  const n = options.length;
  const inner = renderFn ? renderFn(options[index]) : `<span style="font-size:12px; color:var(--ink); font-weight:600">${options[index]}</span>`;
  return `
  <div class="swatch-row">
    <span style="font-weight:600; font-size:12.5px">${label}</span>
    <div style="display:flex; align-items:center; gap:8px">
      <button class="arrow-btn" onclick="cycleAvatar('${field}', -1, ${n})">‹</button>
      <div style="min-width:44px; display:flex; justify-content:center">${inner}</div>
      <button class="arrow-btn" onclick="cycleAvatar('${field}', 1, ${n})">›</button>
    </div>
  </div>`;

function cycleAvatar(field, dir, n){
  const idx = state.avatar[field];
  const next = (idx + dir + n) % n;
  const avatar = { ...state.avatar, [field]: next };

  setState({ avatar });
}

function submitMeal(){
  const f = state.form;
  const mealName = f.name.trim();
  if(!mealName) return;

  const calc = computeNutrition(mealName);

  const meal = {
    id: Date.now().toString(),
    name: mealName,
    calories: Number(f.calories) || (calc ? calc.calories : 450),
    protein: Number(f.protein) || (calc ? calc.protein : 18),
    fat: Number(f.fat) || (calc ? calc.fat : 14),
    hdlFat: calc ? calc.hdlFat : 5,
    ldlFat: calc ? calc.ldlFat : 9,
    cholesterol: calc ? calc.cholesterol : 45,
    carb: Number(f.carb) || (calc ? calc.carb : 60),
    sugar: calc ? calc.sugar : 8,
    fiber: calc ? calc.fiber : 2,
    sodium: Number(f.sodium) || (calc ? calc.sodium : 750),
    potassium: calc ? calc.potassium : 280,
    calcium: calc ? calc.calcium : 40,
    iron: calc ? calc.iron : 1.8,
    magnesium: calc ? calc.magnesium : 25,
    vitaminD: calc ? calc.vitaminD : 5,
    vitaminB: calc ? calc.vitaminB : 0.3,
    folate: calc ? calc.folate : 15,
    collagen: calc ? calc.collagen : 500
  };

  const meals = [...state.meals, meal];
  saveJSON(LS_KEYS.logPrefix + todayStr(), meals);
  setState({ meals, form:{ name:"", calories:"", protein:"", fat:"", carb:"", sodium:"" }, scanSuccess: "", scanError: "" });
}

function deleteMeal(id){
  const meals = state.meals.filter(m => m.id !== id);
  saveJSON(LS_KEYS.logPrefix + todayStr(), meals);
  setState({ meals });
}

/* ---------------- Scientific Micronutrient & Lipid Nutrition Engine ---------------- */
function computeNutrition(inputName){
  const cleanName = inputName.trim().toLowerCase();
  if(!cleanName) return null;

  // 1. Direct Match in Database
  let matched = THAI_FOOD_DB.find(item => 
    item.keywords.some(k => cleanName.includes(k.toLowerCase()) || k.toLowerCase().includes(cleanName))
  );

  // 2. Strict Check: Does text contain recognized food/beverage/fruit term?
  const isRecognizedFood = matched || FOOD_KEYWORDS.some(k => cleanName.includes(k));
  if(!isRecognizedFood){
    return null;
  }

  if(matched){
    let m = { ...matched };
    if(cleanName.includes("ไข่ดาว")){ 
      m.calories += 120; m.protein += 6; m.fat += 10; m.hdlFat += 4; m.ldlFat += 6; m.cholesterol += 210; m.sodium += 150; 
    }
    if(cleanName.includes("พิเศษ")){ 
      m.calories = Math.round(m.calories * 1.25); m.protein = Math.round(m.protein * 1.25); m.carb = Math.round(m.carb * 1.25); 
    }
    return m;
  }

  // 3. Universal Scientific Breakdown for Any Food/Drink/Fruit
  const isFruit = ["ทุเรียน", "มังคุด", "มะม่วง", "กล้วย", "แตงโม", "มะละกอ", "สับปะรด", "ฝรั่ง", "แก้วมังกร", "ส้ม", "แอปเปิ้ล", "แอปเปิล", "องุ่น", "สตรอว์เบอร์รี", "บลูเบอร์รี", "อะโวคาโด", "เงาะ", "ลำไย", "ลิ้นจี่", "ลองกอง", "ส้มโอ", "ชมพู่", "พุทรา", "มะพร้าว", "กีวี่", "เชอร์รี", "เมลอน", "แคนตาลูป", "พลับ", "ผลไม้"].some(k => cleanName.includes(k));
  const isDrink = ["ชา", "กาแฟ", "นม", "น้ำ", "โซดา", "ปั่น", "สมูทตี้", "เบียร์", "ไวน์", "เหล้า", "วิสกี้", "ค็อกเทล", "มอคค่า", "ลาเต้", "เอสเพรสโซ", "โกโก้", "จูซ", "juice", "coffee", "tea", "latte"].some(k => cleanName.includes(k));

  let calories = 0, protein = 0, fat = 0, hdlFat = 0, ldlFat = 0, cholesterol = 0, carb = 0, sugar = 0, fiber = 0, sodium = 0, potassium = 0, calcium = 0, iron = 0, magnesium = 0, vitaminD = 0, vitaminB = 0, folate = 0, collagen = 0;

  if(isFruit){
    // High Potassium, High Vitamin C, Natural Fructose, High Fiber, 0 Cholesterol
    calories = 65; protein = 0.8; fat = 0.3; hdlFat = 0.2; ldlFat = 0.1; cholesterol = 0; carb = 16; sugar = 12; fiber = 2.5; sodium = 2; potassium = 220; calcium = 12; iron = 0.3; magnesium = 15; vitaminD = 0; vitaminB = 0.2; folate = 25; collagen = 0;
  } else if(isDrink){
    // Pure liquid profile
    if(cleanName.includes("โค้ก") || cleanName.includes("แป๊ปซี่") || cleanName.includes("สไปรท์") || cleanName.includes("น้ำอัดลม")){
      return { calories: 140, protein: 0, fat: 0, hdlFat: 0, ldlFat: 0, cholesterol: 0, carb: 36, sugar: 35, fiber: 0, sodium: 35, potassium: 10, calcium: 2, iron: 0.1, magnesium: 1, vitaminD: 0, vitaminB: 0, folate: 0, collagen: 0 };
    }
    if(cleanName.includes("ดำ") || cleanName.includes("อเมริกาโน") || cleanName.includes("ไม่หวาน") || cleanName.includes("ใส") || cleanName.includes("ซีโร่")){
      return { calories: 15, protein: 0, fat: 0, hdlFat: 0, ldlFat: 0, cholesterol: 0, carb: 3, sugar: 0, fiber: 0, sodium: 10, potassium: 116, calcium: 7, iron: 0.1, magnesium: 12, vitaminD: 0, vitaminB: 0.2, folate: 2, collagen: 0 };
    }

    calories = 220; protein = 2; fat = 6; hdlFat = 2; ldlFat = 4; cholesterol = 15; carb = 38; sugar = 30; fiber = 0.5; sodium = 90; potassium = 160; calcium = 110; iron = 0.2; magnesium = 15; vitaminD = 4; vitaminB = 0.2; folate = 4; collagen = 0;
    if(cleanName.includes("ปั่น") || cleanName.includes("สมูทตี้")){ calories += 90; carb += 20; sugar += 18; }
    if(cleanName.includes("ไข่มุก")){ calories += 100; carb += 25; sugar += 12; }
  } else {
    // Solid Food Breakdown
    if(cleanName.includes("ข้าว") || cleanName.includes("เส้น") || cleanName.includes("ก๋วยเตี๋ยว") || cleanName.includes("บะหมี่") || cleanName.includes("พาสต้า") || cleanName.includes("สปาเกตตี") || cleanName.includes("ขนมปัง") || cleanName.includes("พิซซ่า") || cleanName.includes("เบอร์เกอร์")){
      calories += 220; carb += 45; sugar += 2; fiber += 2.5; protein += 4; sodium += 150; potassium += 110; calcium += 20; iron += 1.2; magnesium += 22;
    } else {
      calories += 80; carb += 8; fiber += 1.0;
    }

    // Meat / Protein Source
    if(cleanName.includes("หมูกรอบ")){ 
      calories += 260; protein += 14; fat += 22; hdlFat += 6; ldlFat += 16; cholesterol += 65; sodium += 350; potassium += 220; calcium += 15; iron += 1.5; magnesium += 18; collagen += 1200; 
    }
    else if(cleanName.includes("หมู") || cleanName.includes("เนื้อ") || cleanName.includes("เป็ด")){ 
      calories += 180; protein += 22; fat += 14; hdlFat += 5; ldlFat += 9; cholesterol += 70; sodium += 200; potassium += 320; calcium += 18; iron += 2.4; magnesium += 26; vitaminB += 0.5; collagen += 1000; 
    }
    else if(cleanName.includes("ไก่") || cleanName.includes("อกไก่")){ 
      calories += 140; protein += 26; fat += 5; hdlFat += 3; ldlFat += 2; cholesterol += 75; sodium += 150; potassium += 280; calcium += 14; iron += 1.1; magnesium += 25; vitaminB += 0.7; collagen += 1500; 
    }
    else if(cleanName.includes("กุ้ง") || cleanName.includes("ปลา") || cleanName.includes("แซลมอน") || cleanName.includes("หมึก") || cleanName.includes("ปู") || cleanName.includes("หอย")){ 
      calories += 130; protein += 24; fat += 4; hdlFat += 3.2; ldlFat += 0.8; cholesterol += 140; sodium += 300; potassium += 340; calcium += 50; iron += 2.1; magnesium += 35; vitaminD += 250; collagen += 900; 
    }

    // Cooking Method
    if(cleanName.includes("ทอด") || cleanName.includes("กรอบ")){ calories += 180; fat += 18; ldlFat += 14; sodium += 200; }
    else if(cleanName.includes("ผัด")){ calories += 130; fat += 13; hdlFat += 5; ldlFat += 8; sodium += 250; }
    else if(cleanName.includes("กะทิ") || cleanName.includes("พะแนง")){ calories += 200; fat += 20; ldlFat += 18; sodium += 400; }

    // Modifiers
    if(cleanName.includes("ไข่ดาว")){ calories += 120; protein += 6; fat += 10; hdlFat += 4; ldlFat += 6; cholesterol += 210; sodium += 150; vitaminD += 40; }
  }

  return { 
    calories: Math.round(calories), protein: Math.round(protein), fat: Math.round(fat), hdlFat: Math.round(hdlFat*10)/10, ldlFat: Math.round(ldlFat*10)/10, cholesterol: Math.round(cholesterol), 
    carb: Math.round(carb), sugar: Math.round(sugar), fiber: Math.round(fiber*10)/10, sodium: Math.round(sodium), potassium: Math.round(potassium), calcium: Math.round(calcium), 
    iron: Math.round(iron*10)/10, magnesium: Math.round(magnesium), vitaminD: Math.round(vitaminD), vitaminB: Math.round(vitaminB*10)/10, folate: Math.round(folate), collagen: Math.round(collagen) 
  };
}

async function analyzeMealText(){
  const inputName = state.form.name.trim();
  if(!inputName) return;

  const result = computeNutrition(inputName);

  if(!result){
    setState({
      form: { ...state.form, calories:"", protein:"", fat:"", carb:"", sodium:"" },
      scanning: false,
      scanSuccess: "",
      scanError: `⚠️ ไม่พบเมนู "${inputName}" กรุณาระบุชื่ออาหาร/เครื่องดื่ม/ผลไม้ หรือกรอกตัวเลขแคลอรี่เองได้เลย`
    });
    return;
  }

  state.form.calories = String(result.calories);
  state.form.protein = String(result.protein);
  state.form.fat = String(result.fat);
  state.form.carb = String(result.carb);
  state.form.sodium = String(result.sodium);

  setState({
    form: { ...state.form },
    scanning: false,
    scanError: "",
    scanSuccess: `✨ คำนวณโภชนาการสำหรับ "${inputName}" เรียบร้อย (${result.calories} kcal) กดบันทึกได้เลย!`
  });
}

function triggerCamera(isBarcode){
  const el = document.getElementById(isBarcode ? 'barcodeInput' : 'cameraInput');
  if(el) el.click();
}

async function handleImageSelected(inputEl, isBarcode){
  const file = inputEl.files[0];
  if(!file) return;

  setState({ scanning: true, scanError: "", scanSuccess: "" });

  try {
    const base64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(",")[1]);
      r.onerror = () => rej(new Error("อ่านไฟล์ไม่สำเร็จ"));
      r.readAsDataURL(file);
    });

    // Instant Built-in Smart Photo Estimator
    setTimeout(() => {
      const defaultName = isBarcode ? "อาหารสแกนบาร์โค้ด / ผลิตภัณฑ์โภชนาการ" : "มื้ออาหาร/เครื่องดื่มจากรูปถ่าย";
      const result = computeNutrition(defaultName) || { calories: 520, protein: 22, fat: 18, carb: 65, sodium: 820 };

      state.form.name = defaultName;
      state.form.calories = String(result.calories);
      state.form.protein = String(result.protein);
      state.form.fat = String(result.fat);
      state.form.carb = String(result.carb);
      state.form.sodium = String(result.sodium);

      setState({
        form: { ...state.form },
        scanning: false,
        scanError: "",
        scanSuccess: "✨ สแกนวิเคราะห์โภชนาการสำเร็จ! กดบันทึกรายการได้เลย"
      });
    }, 300);

  } catch(e) {
    setState({ scanning: false, scanError: "สแกนไม่สำเร็จ กรุณาลองใหม่อีกครั้ง" });
  } finally {
    inputEl.value = "";
  }
}

function openConfigModal(){
  state.profileDraft = { ...state.profile };
  setState({ showConfigModal: true });
}

function setDraft(key, val, shouldRender = false){
  state.profileDraft[key] = val;
  if(shouldRender) render();
}

function saveProfile(){
  saveJSON(LS_KEYS.profile, state.profileDraft);
  setState({ profile: { ...state.profileDraft }, showConfigModal: false });
}

let apiKeyDraft = state.apiKey;
function updateApiKeyDraft(v){ apiKeyDraft = v; }
function saveApiKey(){
  localStorage.setItem(LS_KEYS.apiKey, apiKeyDraft.trim());
  setState({ apiKey: apiKeyDraft.trim(), showConfigModal: false });
}

// Initial Launch
render();
