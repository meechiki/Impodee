/* ---------------- TDEE & Math Engine ---------------- */
function calcTargets(p){
  const w = Number(p.weight) || 65;
  const h = Number(p.height) || 170;
  const a = Number(p.age) || 25;
  
  let bmr = p.gender === "female" ? (10*w + 6.25*h - 5*a - 161) : (10*w + 6.25*h - 5*a + 5);
  const actMult = (ACTIVITY_LEVELS.find(x => x.id === p.activity) || ACTIVITY_LEVELS[0]).mult;
  const goalAdj = (GOALS.find(x => x.id === p.goal) || GOALS[1]).adj;
  
  const tdee = bmr * actMult;
  const calories = Math.max(1000, Math.round(tdee * (1 + goalAdj)));
  const protein = Math.round(w * 1.8);
  const fat = Math.round((calories * 0.25) / 9);
  const carb = Math.max(0, Math.round((calories - protein*4 - fat*9) / 4));
  
  return { calories, protein, fat, carb, sodium: 2000, tdee: Math.round(tdee) };
}

function sumLog(meals){
  return meals.reduce((acc, m) => ({
    calories: acc.calories + (Number(m.calories) || 0),
    protein: acc.protein + (Number(m.protein) || 0),
    fat: acc.fat + (Number(m.fat) || 0),
    carb: acc.carb + (Number(m.carb) || 0),
    sodium: acc.sodium + (Number(m.sodium) || 0),
  }), { calories:0, protein:0, fat:0, carb:0, sodium:0 });
}

function classifyMood(totals, targets){
  if(!totals.calories) return "idle";
  const r = totals.calories / targets.calories;
  if(r > 1.1) return "full";
  if(r < 0.85) return "hungry";
  return "happy";
}

function computeStreak(targets){
  let count = 0;
  const totals = sumLog(state.meals);
  const todayOnTarget = classifyMood(totals, targets) === "happy";
  if(todayOnTarget) count += 1;

  const cursor = new Date();
  cursor.setDate(cursor.getDate() - 1);
  for(let i = 0; i < 60; i++){
    const key = LS_KEYS.logPrefix + todayStr(cursor);
    const raw = localStorage.getItem(key);
    if(raw === null) break;
    const dayMeals = JSON.parse(raw);
    const dayTotals = sumLog(dayMeals);
    const ratio = dayTotals.calories / Math.max(1, targets.calories);
    if(ratio >= 0.85 && ratio <= 1.1){
      count += 1;
      cursor.setDate(cursor.getDate() - 1);
    } else break;
  }
  return count;
}

function macroPill(label, value, target, unit, color, icon){
  const pct = Math.min(100, Math.round((value / Math.max(1, target)) * 100));
  return `
  <div class="macro-pill">
    <div class="macro-header">
      <span>${icon} ${label}</span>
      <span>${pct}%</span>
    </div>
    <div class="macro-val">${Math.round(value)} <span style="font-size:11px; color:var(--ink-soft); font-weight:400">/ ${target}${unit}</span></div>
    <div class="progress-track">
      <div class="progress-fill" style="width:${pct}%; background:${color}"></div>
    </div>
  </div>`;
}

function arrowPickerHTML(label, options, index, field, renderFn){
  const n = options.length;
  const inner = renderFn ? renderFn(options[index]) : `<span style="font-size:12px; color:var(--ink); font-weight:600">${options[index]}</span>`;
  return `
  <div class="swatch-row">
    <span style="font-weight:600; font-size:12.5px">${label}</span>
    <div style="display:flex; align-items:center; gap:8px">
      <button class="arrow-btn" onclick="cycleAvatar('${field}', -1, ${n})">‹</button>
      <div style="min-width:44px; display:flex; justify-content:center">${inner}</div>
      <button class="arrow-btn" onclick="cycleAvatar('${field}', 1, ${n})">›</button>
    </div>
  </div>`;
}

function swatch(color){
  return `<div class="swatch" style="background:${color}; ${color==='#FFFFFF' ? 'box-shadow:inset 0 0 0 1px #ddd;' : ''}"></div>`;
}

function cycleAvatar(field, dir, n){
  const idx = state.avatar[field];
  const next = (idx + dir + n) % n;
  const avatar = { ...state.avatar, [field]: next };
  saveJSON(LS_KEYS.avatar, avatar);
  setState({ avatar });
}

function escapeHTML(s){ const d = document.createElement('div'); d.innerText = s; return d.innerHTML; }
function escapeAttr(s){ return String(s).replace(/"/g, '&quot;'); }

          ${arrowPickerHTML("สีผิว", SKIN_TONES, state.avatar.skinTone, "skinTone", swatch)}
          ${arrowPickerHTML("เสื้อ", SHIRT_COLORS, state.avatar.shirtColor, "shirtColor", swatch)}
          ${arrowPickerHTML("กางเกง", PANTS_COLORS, state.avatar.pantsColor, "pantsColor", swatch)}
          ${arrowPickerHTML("รองเท้า", SHOE_COLORS, state.avatar.shoeColor, "shoeColor", swatch)}

    </div>

    <!-- Quick Meal Entry Card with Auto Calculator -->
    <div class="glass-card">
      <div class="quick-logger-header">
        <div class="quick-logger-title">
          <span>➕ บันทึกมื้ออาหาร</span>
        </div>
        <button class="icon-btn" onclick="openConfigModal()" title="ตั้งค่า TDEE">⚙️</button>
      </div>

      <!-- Camera & Barcode Action Buttons -->
      <div class="ai-scan-btn-group">
        <button onclick="triggerCamera(false)" class="ai-btn" style="background:linear-gradient(135deg, var(--emerald) 0%, var(--emerald-deep) 100%); color:#fff">
          📷 ถ่ายรูปอาหาร
        </button>
        <button onclick="triggerCamera(true)" class="ai-btn" style="background:linear-gradient(135deg, var(--blue) 0%, var(--blue-deep) 100%); color:#fff">

      <input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="handleImageSelected(this, false)"/>
      <input id="barcodeInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="handleImageSelected(this, true)"/>

      ${state.scanning ? `<div style="color:var(--emerald-deep); font-size:12.5px; font-weight:600; text-align:center; padding:6px 0">✨ กำลังคำนวณสารอาหาร...</div>` : ""}
      ${state.scanSuccess ? `<div class="status-badge" style="color:var(--emerald-deep); background:var(--emerald-light); border:1px solid rgba(16, 185, 129, 0.3)">${state.scanSuccess}</div>` : ""}
      ${state.scanError ? `<div class="status-badge" style="color:var(--coral-deep); background:var(--coral-light); border:1px solid rgba(255, 107, 74, 0.3)">${state.scanError}</div>` : ""}

        <input class="field-input" placeholder="พิมพ์ชื่ออาหาร (เช่น ผัดไทย, ข้าวมันไก่, กะเพราไข่ดาว)" value="${escapeAttr(f.name)}" oninput="handleNameInput(this.value)"/>
        <button class="ai-text-btn" onclick="analyzeMealText()" title="พิมพ์ชื่ออาหารให้เสร็จแล้วกดปุ่มนี้เพื่อคำนวณ">
          ✨ คำนวณ
        </button>
      </div>

      <div class="input-row">
        <input class="field-input" type="number" placeholder="แคลอรี่ (kcal)" value="${escapeAttr(f.calories)}" oninput="updateForm('calories', this.value)"/>
        <input class="field-input" type="number" placeholder="โซเดียม (mg)" value="${escapeAttr(f.sodium)}" oninput="updateForm('sodium', this.value)"/>
      </div>

      <div class="input-grid-4">
        <input class="field-input" type="number" placeholder="โปรตีน(g)" value="${escapeAttr(f.protein)}" oninput="updateForm('protein', this.value)"/>
        <input class="field-input" type="number" placeholder="ไขมัน(g)" value="${escapeAttr(f.fat)}" oninput="updateForm('fat', this.value)"/>
        <input class="field-input" type="number" placeholder="คาร์บ(g)" value="${escapeAttr(f.carb)}" oninput="updateForm('carb', this.value)"/>
        <span style="font-size:11px; color:var(--ink-soft); display:flex; align-items:center; justify-content:center">ปรับแก้ได้</span>
      </div>

      <!-- Prominent 100% Clickable Save Button -->
      <button class="primary-btn" style="opacity:${canSave ? 1 : 0.5}" onclick="submitMeal()" ${canSave ? '' : 'disabled'}>
        บันทึกรายการมื้ออาหาร
      </button>
    </div>

    <!-- Today's Meals List -->
    <div class="glass-card">
      <div style="font-family:'Kanit'; font-weight:600; font-size:15px; margin-bottom:10px">
        🍽️ รายการที่บันทึกวันนี้ (${state.meals.length})
      </div>
      ${state.meals.length === 0 
        ? `<div style="color:var(--ink-soft); font-size:13px; text-align:center; padding:12px 0">ยังไม่มีรายการมื้ออาหารในวันนี้</div>` 
        : state.meals.map(mealRowHTML).join("")}
    </div>

    <!-- Centered Modal Sheet for Config/Profile -->
    <div class="modal-overlay ${state.showConfigModal ? 'open' : ''}" onclick="if(event.target===this) setState({showConfigModal:false})">
      <div class="modal-sheet">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px">
          <div style="font-family:'Kanit'; font-weight:700; font-size:18px">⚙️ ตั้งค่าข้อมูลส่วนตัว TDEE</div>
          <button onclick="setState({showConfigModal:false})" style="background:transparent; font-size:20px; color:var(--ink-soft)">✕</button>
        </div>

        <div style="margin-bottom:14px">
          <label style="font-size:12px; font-weight:600; color:var(--ink-muted); display:block; margin-bottom:4px">เพศ</label>
          <div class="segmented-control">
            <button class="segmented-btn ${state.profileDraft.gender==='male'?'active':''}" onclick="setDraft('gender','male', true)">👨 ชาย</button>
            <button class="segmented-btn ${state.profileDraft.gender==='female'?'active':''}" onclick="setDraft('gender','female', true)">👩 หญิง</button>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px">
          <div><label style="font-size:11.5px; font-weight:600; color:var(--ink-muted)">อายุ (ปี)</label><input class="field-input" type="number" value="${escapeAttr(state.profileDraft.age)}" oninput="setDraft('age', this.value, false)"/></div>
          <div><label style="font-size:11.5px; font-weight:600; color:var(--ink-muted)">น้ำหนัก (kg)</label><input class="field-input" type="number" value="${escapeAttr(state.profileDraft.weight)}" oninput="setDraft('weight', this.value, false)"/></div>
          <div><label style="font-size:11.5px; font-weight:600; color:var(--ink-muted)">ส่วนสูง (cm)</label><input class="field-input" type="number" value="${escapeAttr(state.profileDraft.height)}" oninput="setDraft('height', this.value, false)"/></div>
        </div>

        <div style="margin-bottom:12px">
          <label style="font-size:12px; font-weight:600; color:var(--ink-muted); display:block; margin-bottom:4px">ระดับกิจกรรม</label>
          <select class="field-input" onchange="setDraft('activity', this.value, true)">
            ${ACTIVITY_LEVELS.map(a => `<option value="${a.id}" ${state.profileDraft.activity===a.id?'selected':''}>${a.label}</option>`).join("")}
          </select>
        </div>

        <div style="margin-bottom:16px">
          <label style="font-size:12px; font-weight:600; color:var(--ink-muted); display:block; margin-bottom:4px">เป้าหมายน้ำหนัก</label>
          <div class="segmented-control">
            ${GOALS.map(g => `<button class="segmented-btn ${state.profileDraft.goal===g.id?'active':''}" onclick="setDraft('goal','${g.id}', true)">${g.label}</button>`).join("")}
          </div>
        </div>

        <button class="primary-btn" onclick="saveProfile()" style="margin-bottom:12px">💾 บันทึกเป้าหมาย TDEE</button>
      </div>
    </div>
  `;
}

function mealRowHTML(m){
  return `
  <div class="meal-item">
    <div>
      <div class="meal-title">${escapeHTML(m.name)}</div>
      <div class="meal-sub">${m.calories} kcal · P${m.protein}g · F${m.fat}g · C${m.carb}g · Na${m.sodium}mg</div>
    </div>
    <button onclick="deleteMeal('${m.id}')" style="background:rgba(239,68,68,0.08); color:var(--coral-deep); border-radius:999px; padding:4px 10px; font-size:11.5px; font-weight:600">ลบ</button>
  </div>`;
}

function updateForm(key, value){
  state.form[key] = value;
  if(key === 'name' || key === 'calories'){
    const saveBtn = document.querySelector('.primary-btn');
    if(saveBtn){
      const canSave = state.form.name.trim().length > 0;
      saveBtn.disabled = !canSave;
      saveBtn.style.opacity = canSave ? 1 : 0.5;
    }
  }
}

// Simple Name Input - Allow user to type completely without interrupting them!
function handleNameInput(val){
  state.form.name = val;
  const canSave = val.trim().length > 0;
  const saveBtn = document.querySelector('.primary-btn');
  if(saveBtn){
    saveBtn.disabled = !canSave;
    saveBtn.style.opacity = canSave ? 1 : 0.5;
  }
}

function submitMeal(){
  const f = state.form;
  const mealName = f.name.trim();
  if(!mealName) return;

  // Auto-calculate if calories field is empty upon save
  if(!f.calories || Number(f.calories) <= 0){
    const calc = computeNutrition(mealName);
    if(calc){
      f.calories = String(calc.calories);
      f.protein = String(calc.protein);
      f.fat = String(calc.fat);
      f.carb = String(calc.carb);
      f.sodium = String(calc.sodium);
    }
  }

  const meal = {
    id: Date.now().toString(),
    name: mealName,
    calories: Number(f.calories) || 450,
    protein: Number(f.protein) || 18,
    fat: Number(f.fat) || 14,
    carb: Number(f.carb) || 60,
    sodium: Number(f.sodium) || 750
  };

  const meals = [...state.meals, meal];
  saveJSON(LS_KEYS.logPrefix + todayStr(), meals);
  setState({ meals, form:{ name:"", calories:"", protein:"", fat:"", carb:"", sodium:"" }, scanSuccess: "", scanError: "" });
}

function deleteMeal(id){
  const meals = state.meals.filter(m => m.id !== id);
  saveJSON(LS_KEYS.logPrefix + todayStr(), meals);
  setState({ meals });
}

/* ---------------- Strict Food Validation & Scientific Nutrition Calculation Engine ---------------- */
function computeNutrition(inputName){
  const cleanName = inputName.trim().toLowerCase();
  if(!cleanName) return null;

  // 1. Direct or Partial Match in Thai Food Database
  let matched = THAI_FOOD_DB.find(item => 
    item.keywords.some(k => cleanName.includes(k.toLowerCase()) || k.toLowerCase().includes(cleanName))
  );

  // 2. Strict Check: Does the typed text contain ANY valid food-related keyword or character?
  const isRecognizedFood = matched || FOOD_KEYWORDS.some(k => cleanName.includes(k));

  // If it's NOT a valid food item (e.g. gibberish or nonsensical text), return NULL!
  if(!isRecognizedFood){
    return null;
  }

  let base = matched ? { ...matched } : null;

  // 3. Semantic Dish Categorizer (if no exact database match but is a recognized food)
  if(!base){
    base = { name: inputName, calories: 450, protein: 18, fat: 14, carb: 60, sodium: 800 };

    if(cleanName.includes("กะเพรา") || cleanName.includes("กระเพรา")){
      base = { name: inputName, calories: 580, protein: 22, fat: 24, carb: 68, sodium: 980 };
    } else if(cleanName.includes("ผัดไทย") || cleanName.includes("ผัดไท")){
      base = { name: inputName, calories: 580, protein: 22, fat: 21, carb: 76, sodium: 1150 };
    } else if(cleanName.includes("ข้าวผัด")){
      base = { name: inputName, calories: 550, protein: 18, fat: 16, carb: 82, sodium: 780 };
    } else if(cleanName.includes("ก๋วยเตี๋ยว") || cleanName.includes("บะหมี่") || cleanName.includes("เส้น")){
      base = { name: inputName, calories: 410, protein: 18, fat: 12, carb: 55, sodium: 1400 };
    } else if(cleanName.includes("ทอด") || cleanName.includes("กรอบ")){
      base = { name: inputName, calories: 620, protein: 20, fat: 30, carb: 70, sodium: 900 };
    } else if(cleanName.includes("ต้ม") || cleanName.includes("แกงจืด")){
      base = { name: inputName, calories: 150, protein: 16, fat: 5, carb: 8, sodium: 800 };
    } else if(cleanName.includes("ยำ") || cleanName.includes("ส้มตำ")){
      base = { name: inputName, calories: 130, protein: 6, fat: 2, carb: 22, sodium: 1300 };
    } else if(cleanName.includes("สเต๊ก") || cleanName.includes("สเต็ก")){
      base = { name: inputName, calories: 480, protein: 35, fat: 26, carb: 10, sodium: 750 };
    } else if(cleanName.includes("ชา") || cleanName.includes("กาแฟ") || cleanName.includes("นม")){
      base = { name: inputName, calories: 250, protein: 3, fat: 8, carb: 40, sodium: 110 };
    }
  }

  // 4. Ingredient Modifier Calculation (ไข่ดาว, ไข่เจียว, พิเศษ, ฯลฯ)
  let calories = base.calories;
  let protein = base.protein;
  let fat = base.fat;
  let carb = base.carb;
  let sodium = base.sodium;

  if(cleanName.includes("ไข่ดาว")){
    calories += 120; protein += 6; fat += 10; sodium += 150;
  }
  if(cleanName.includes("ไข่เจียว") && !cleanName.includes("ข้าวไข่เจียว")){
    calories += 240; protein += 7; fat += 22; sodium += 350;
  }
  if(cleanName.includes("ไข่ต้ม")){
    calories += 75; protein += 6; fat += 5; sodium += 70;
  }
  if(cleanName.includes("พิเศษ")){
    calories = Math.round(calories * 1.25);
    protein = Math.round(protein * 1.25);
    carb = Math.round(carb * 1.25);
  }

  return { calories, protein, fat, carb, sodium };
}

// Triggered ONLY when user clicks the "✨ คำนวณ" button!
async function analyzeMealText(){
  const inputName = state.form.name.trim();
  if(!inputName) return;

  const result = computeNutrition(inputName);

  if(!result){
    setState({
      form: { ...state.form, calories:"", protein:"", fat:"", carb:"", sodium:"" },
      scanning: false,
      scanSuccess: "",
      scanError: `⚠️ ไม่พบชื่ออาหาร "${inputName}" ในระบบ กรุณาระบุชื่ออาหาร หรือกรอกตัวเลขแคลอรี่เองได้เลย`
    });
    return;
  }

  state.form.calories = String(result.calories);
  state.form.protein = String(result.protein);
  state.form.fat = String(result.fat);
  state.form.carb = String(result.carb);
  state.form.sodium = String(result.sodium);

  setState({
    form: { ...state.form },
    scanning: false,
    scanError: "",
    scanSuccess: `✨ คำนวณโภชนาการสำหรับ "${inputName}" เรียบร้อย (${result.calories} kcal) กดบันทึกได้เลย!`
  });
}

function triggerCamera(isBarcode){
  const el = document.getElementById(isBarcode ? 'barcodeInput' : 'cameraInput');
  if(el) el.click();
}

async function handleImageSelected(inputEl, isBarcode){
  const file = inputEl.files[0];
  if(!file) return;

  setState({ scanning: true, scanError: "", scanSuccess: "" });

  try {
    const base64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(",")[1]);
      r.onerror = () => rej(new Error("อ่านไฟล์ไม่สำเร็จ"));
      r.readAsDataURL(file);
    });

    // Instant Built-in Smart Photo Estimator
    setTimeout(() => {
      const defaultName = isBarcode ? "อาหารสแกนบาร์โค้ด / ผลิตภัณฑ์โภชนาการ" : "มื้ออาหารจากรูปถ่าย";
      const result = computeNutrition(defaultName) || { calories: 520, protein: 22, fat: 18, carb: 65, sodium: 820 };

      state.form.name = defaultName;
      state.form.calories = String(result.calories);
      state.form.protein = String(result.protein);
      state.form.fat = String(result.fat);
      state.form.carb = String(result.carb);
      state.form.sodium = String(result.sodium);

      setState({
        form: { ...state.form },
        scanning: false,
        scanError: "",
        scanSuccess: "✨ สแกนวิเคราะห์โภชนาการสำเร็จ! กดบันทึกรายการมื้ออาหารได้เลย"
      });
    }, 300);

  } catch(e) {
    setState({ scanning: false, scanError: "สแกนไม่สำเร็จ กรุณาลองใหม่อีกครั้ง" });
  } finally {
    inputEl.value = "";
  }
}

function openConfigModal(){
  state.profileDraft = { ...state.profile };
  setState({ showConfigModal: true });
}

function setDraft(key, val, shouldRender = false){
  state.profileDraft[key] = val;
  if(shouldRender) render();
}

function saveProfile(){
  saveJSON(LS_KEYS.profile, state.profileDraft);
  setState({ profile: { ...state.profileDraft }, showConfigModal: false });
}

let apiKeyDraft = state.apiKey;
function updateApiKeyDraft(v){ apiKeyDraft = v; }
function saveApiKey(){
  localStorage.setItem(LS_KEYS.apiKey, apiKeyDraft.trim());
  setState({ apiKey: apiKeyDraft.trim(), showConfigModal: false });
}

// Initial Launch
render();
</script>
